<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>Dyslexic Friendly Extension</h1>
    <input type="checkbox" id="toggleSwitch">
    <label for="toggleSwitch">Activate Bionic Reading</label>
    <br>
    
    <label for="focusLength">Focus Length: </label>
    <input type="range" id="focusLength" min="1" max="5" value="2" class="win10-thumb">
    <span id="focusLengthValue"></span>
    <br>
    
    <input type="checkbox" id="darkModeToggle">
    <label for="darkModeToggle">Dark Mode Compatibility - Blue</label>
    <br>
    
    <input type="checkbox" id="darkModeToggle2">
    <label for="darkModeToggle2">Dark Mode Compatibility - Pink</label>
    <br>

    <div class="dropdown-group">
      <label for="chooseFont">Font</label>
      <input type="text" placeholder="Search.." id="chooseFont" class="text-input">
      <div id="fontChoices" class="dropdown-choices"></div>
    </div>
    <br>

    <div class="dropdown-group">
      <label for="chooseFontColor">Font Color</label>
      <input type="text" placeholder="Search.." id="chooseFontColor" class="text-input">
      <div id="fontColorChoices" class="dropdown-choices"></div>
    </div>
    <br>

    <label for="chooseFontSize">Font Size</label>
    <input type="text" placeholder="Enter Size" id="chooseFontSize" class="text-input">
    <input type="range" id="slideFontSize" min="10" max="50" class="win10-thumb">
    <br>
    

    <label for="chooseWordSpacing">Word Spacing</label>
    <input type="text" placeholder="Enter Spacing Size" id="chooseWordSpacing" class="text-input">
    <input type="range" id="slideWordSpacing" min="0" max="2" step="0.1" class="win10-thumb">
    <br>

    <label for="chooseLetterSpacing">Letter Spacing</label>
    <input type="text" placeholder="Enter Spacing Size" id="chooseLetterSpacing" class="text-input">
    <input type="range" id="slideLetterSpacing" min="0" max="0.2" step="0.01" class="win10-thumb">
    <br>

    <label for="chooseLineSpacing">Line Spacing</label>
    <input type="text" placeholder="Enter Spacing Size" id="chooseLineSpacing" class="text-input">
    <input type="range" id="slideLineSpacing" min="1" max="5" step="0.5" class="win10-thumb">
    <br>

    <div class="dropdown-group">
      <label for="chooseBgColor">Overlay Color</label>
      <input type="text" placeholder="Choose Color" id="chooseBgColor" class="text-input">
      <div id="bgColorChoices" class="dropdown-choices"></div>
    <br>
    </div>

    <label for="resetSettings"> Presets </label>
    <br>
    <button id="compact" class="custom-button"> Compact </button>
    <button id="open" class="custom-button"> Open </button>
    <button id="relaxed" class="custom-button"> Relaxed </button>
    <br>

    <label for="resetSettings">Reset Settings</label>
    <button id="resetSettings" class="custom-button"> Reset </button>
    <br>
    <script src="popup.js"></script>
  </body>
</html>
