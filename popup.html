<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>Better Browsing: A Dyslexia-Friendly Extension</h1>

    
    <div class="presets-reset">
      <div class="tab-header">
          <p>Text Enhancements</p>
      </div>
      <!-- <div>
      <label for="test-button">Test NLP</label>
      <button id="test-button">run test</button>
      </div> -->
      
      <div class="presets-container">
        
        <label for="apply-bionic-reading">Selective Bionic Reading</label>
        <div class="bionic-reading-col">
          <button id="apply-bionic-reading" class="preset-button">Apply Bionic Reading</button>
          <button id="btnRemoveBionic" class="preset-button">Remove Bionic Reading</button>
        </div>
      </div>

      <div class="presets-container">
        <label for="colorize-keywords">Colorize Keywords</label>
        <div class="bionic-reading-col">
          <button id="colorize-keywords" class="preset-button">Colorize Keywords</button>
          <button id="btnRemoveColorizeKeywords" class="preset-button">Remove Keywords</button>
        </div>
        <div class="control-group">
          <label for="keywordColor">Keyword Color:</label>
          <input type="color" id="keywordColor" value="#C70000">
        </div>
      </div>
      

      
    </div>


    <!-- PRESETS TAB -->
    
    <div class="presets-reset">
    <div class="tab-header">  
      <p>Presets</p>
      <!-- <label for="resetSettings">Reset Settings</label> -->
      <button id="resetSettings" class="reset-button"> Reset Settings </button>
    </div>
    <div class="presets-container" id="presetTab">
      <button id="compact" class="preset-button"> Compact </button>
      <button id="open" class="preset-button"> Open </button>
      <button id="relaxed" class="preset-button"> Relaxed </button>
    </div>
    <div class="my-presets">
      <div class="tab-header">
        <p>My Presets</p>
      </div>
      <div class="save-presets">
        <input type="text" id="newPresetName" placeholder="Preset Name..." />
        <button id="savePreset" class="reset-button"> Save Preset </button>
      </div>
      <div id="presetList" class="presets-container">
      </div>
    </div>
    

    <!-- TABS -->
    <div class="tab">
      <button class="tab-links" data-tab="fontTab">Font</button>
      <button class="tab-links" data-tab="spacingTab">Spacing</button>
      <button class="tab-links" data-tab="bionicTab">Bionic</button>
    </div>

    <!-- FONT TAB -->
    <div class="tab-content" id="fontTab">
      <div class="dropdown-container">
        <label for="chooseFont">Font Type</label>
        <input type="text" placeholder="Search.." id="chooseFont" class="text-input">
        <div id="fontChoices" class="dropdown-choices"></div>
      </div>

      <div class="control-group">
        <label for="chooseFontColor">Font Color</label>
        <div style="display: flex; align-items: center; gap: 10px;">
          <input type="color" id="chooseFontColor" value="#000000" style="cursor: pointer; height: 40px; width: 60px;">
          
          <button id="resetFontColor" style="font-size: 12px; padding: 5px 10px;">Reset to Default</button>
        </div>
      </div>
      
      <div class="dropdown-container">
        <label for="chooseFontSize">Font Size</label>
        <input type="text" placeholder="Enter Size" id="chooseFontSize" class="text-input">
        <input type="range" id="slideFontSize" min="10" max="50" class="win10-thumb">
      </div>
    </div>

    <!-- SPACING TAB -->
    <div class="tab-content" id="spacingTab">
      <div class="container">
        <label for="chooseWordSpacing">Word Spacing</label>
        <input type="text" placeholder="Enter Spacing Size" id="chooseWordSpacing" class="text-input">
        <input type="range" id="slideWordSpacing" min="0" max="2" step="0.1" class="win10-thumb">
      </div>  

      <div class="container">
        <label for="chooseLetterSpacing">Letter Spacing</label>
        <input type="text" placeholder="Enter Spacing Size" id="chooseLetterSpacing" class="text-input">
        <input type="range" id="slideLetterSpacing" min="0" max="0.2" step="0.01" class="win10-thumb">
      </div>

      <div class="container">
        <label for="chooseLineSpacing">Line Spacing</label>
        <input type="text" placeholder="Enter Spacing Size" id="chooseLineSpacing" class="text-input">
        <input type="range" id="slideLineSpacing" min="1" max="5" step="0.5" class="win10-thumb">
      </div>
    </div>

    <!-- BIONIC TAB -->
    <div class="tab-content" id="bionicTab">
      <div class="dropdown-container">
        <label for="chooseBgColor">Overlay Color</label>
        <input type="text" placeholder="Choose Color" id="chooseBgColor" class="text-input">
        <div id="bgColorChoices" class="dropdown-choices"></div>

      </div>

      <div class="container">
        <input type="checkbox" id="toggleSwitch">
        <label for="toggleSwitch">Activate Bionic Reading</label>
        
        <br>
        <label for="focusLength">Focus Length: </label>
        <br>
        <input type="range" id="focusLength" min="1" max="5" value="2" class="win10-thumb">
        <span id="focusLengthValue"></span>
        <br>
        
        <input type="checkbox" id="darkModeToggle">
        <label for="darkModeToggle">Dark Mode Compatibility - Blue</label>
        <br>
        
        <input type="checkbox" id="darkModeToggle2">
        <label for="darkModeToggle2">Dark Mode Compatibility - Pink</label>
        <br>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
